# Per-repo caller.
#
# ⚠️ BEFORE USE: replace YOUR-ORG and REPLACE-WITH-FULL-COMMIT-SHA. Pin to a FULL
# COMMIT SHA — a tag is mutable and can be moved to point at different code.
# This workflow forwards a delete-capable token to a workflow in another repo — with
# `@main`, any change there (or a compromise of it) takes effect everywhere instantly.
#
# Copy to .github/workflows/branch-cleanup.yml
#
# Merged branches are handled by the repo's `delete_branch_on_merge` setting — NOT by
# this workflow. The native setting is more reliable than an Action racing it. This
# covers the two gaps it leaves: PRs closed WITHOUT merging, and orphans.
name: Branch cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '23 3 * * 1'      # weekly orphan sweep (report-only by default)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log without deleting'
        type: boolean
        default: true
      sweep_delete:
        description: 'Let the sweep actually delete (default: report only)'
        type: boolean
        default: false

concurrency:
  group: branch-cleanup-${{ github.event.pull_request.head.ref || 'sweep' }}
  cancel-in-progress: false    # a half-finished sweep is worse than a redundant one

jobs:
  closed-unmerged:
    # Only unmerged closures. Merged PRs are the native setting's job.
    # Fork PRs are skipped inside the reusable workflow too (belt and braces).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: YOUR-ORG/.github/.github/workflows/reusable-branch-cleanup.yml@REPLACE-WITH-FULL-COMMIT-SHA  # a tag is MUTABLE — only a full SHA is immutable
    with:
      branch: ${{ github.event.pull_request.head.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}   # immutable close-time SHA
      dry_run: false
      # Raise to ~10 if you adopt ANY stack tooling — GitHub's native stacks
      # (`gh stack`), Graphite, ghstack or spr. All of them restack by force-pushing and
      # can close/reopen PRs mid-flight, so a `closed` event is not proof of abandonment.
      grace_minutes: 0
    permissions:
      contents: write
      pull-requests: read

  sweep:
    if: github.event_name != 'pull_request'
    uses: YOUR-ORG/.github/.github/workflows/reusable-branch-cleanup.yml@REPLACE-WITH-FULL-COMMIT-SHA  # a tag is MUTABLE — only a full SHA is immutable
    with:
      branch: ''              # empty = orphan sweep
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      sweep_delete: ${{ github.event_name == 'workflow_dispatch' && inputs.sweep_delete || false }}
      grace_minutes: 0
    permissions:
      contents: write
      pull-requests: read
